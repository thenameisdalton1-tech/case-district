
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Case District | iPhone Cases</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f7f7;color:#171717}
header{background:#111;color:white;padding:24px 7%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:800;letter-spacing:2px;color:white;text-decoration:none}
header button,.button{border:0;border-radius:6px;padding:13px;background:#111;color:white;font-weight:bold;cursor:pointer}
header button{background:white;color:#111}
.hero{text-align:center;padding:65px 20px;background:#e9e9e9}
.hero h1{font-size:clamp(34px,6vw,55px);margin:0 0 12px}
main{padding:35px 7%}
.model-selector{background:white;padding:22px;border-radius:12px;margin-bottom:30px;box-shadow:0 3px 14px #0000000d}
.model-selector label{display:block;font-weight:bold;margin-bottom:12px}
#iphone-model{width:100%;padding:14px;border:1px solid #ccc;border-radius:7px;font-size:16px;background:white}
#model-message{margin-top:10px;font-size:14px;color:#555}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
.product{background:white;border-radius:12px;padding:18px;box-shadow:0 3px 14px #0000000d}
.case-art{height:210px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#fff;text-decoration:none;overflow:hidden}
.case-art.clear-art{background:#fff}
.case-photo{width:100%;height:100%;object-fit:contain;padding:8px;display:block}
.phone-case{width:105px;height:175px;border:5px solid #222;border-radius:23px;position:relative;box-shadow:0 7px 15px #0002}
.phone-case:before{content:"";position:absolute;top:12px;left:12px;width:35px;height:35px;border:4px solid #555;border-radius:12px}
.clear{background:#dce7e5}
.colored{background:linear-gradient(135deg,#f5a1a1,#e9c1f5)}
.carbon{background:repeating-linear-gradient(45deg,#202020,#202020 5px,#383838 5px,#383838 10px)}
.product h3 a{color:#171717;text-decoration:none}
.price{font-weight:bold;font-size:19px}
.button{width:100%;margin-top:10px}
.button:disabled{opacity:.45;cursor:not-allowed}
.cart-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #ddd}
.cart-item button{padding:7px 12px;cursor:pointer}
#total{font-size:21px;font-weight:bold;margin-top:20px}
#checkout{background:#167443}
#checkout:disabled{opacity:.5;cursor:not-allowed}
#message{margin-top:12px;color:#b00020}
#cart-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center;padding:15px}
#cart-overlay.open{display:flex}
#cart{background:white;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:25px;border-radius:14px;box-shadow:0 10px 40px #0004}
.cart-header{display:flex;justify-content:space-between;align-items:center}
.cart-header h2{margin:0}
#close-cart{background:transparent;border:0;font-size:28px;cursor:pointer;color:#111}
footer{text-align:center;padding:30px;background:#111;color:white;margin-top:50px}
</style>
</head>

<body>

<header>
<a class="logo" href="index.html">CASE DISTRICT</a>
<button type="button" onclick="openCart()">Cart (<span id="cart-count">0</span>)</button>
</header>

<section class="hero">
<h1>Find Your Case.</h1>
<p>Simple style. Everyday protection.</p>
</section>

<main>
<h2>Shop Our Cases</h2>

<div class="model-selector">
<label for="iphone-model">Choose Your iPhone Model *</label>
<select id="iphone-model" required>
<option value="">Select your iPhone model</option>
<option value="iPhone 16">iPhone 16</option>
<option value="iPhone 16 Pro">iPhone 16 Pro</option>
<option value="iPhone 16 Pro Max">iPhone 16 Pro Max</option>
<option value="iPhone 17">iPhone 17</option>
<option value="iPhone 17 Pro">iPhone 17 Pro</option>
<option value="iPhone 17 Pro Max">iPhone 17 Pro Max</option>
<option value="iPhone 18">iPhone 18</option>
<option value="iPhone 18 Pro">iPhone 18 Pro</option>
<option value="iPhone 18 Pro Max">iPhone 18 Pro Max</option>
</select>
<p id="model-message">Please select your iPhone model before shopping.</p>
</div>

<div class="products" id="products"></div>
</main>

<div id="cart-overlay">
<section id="cart">
<div class="cart-header">
<h2>Your Shopping Cart</h2>
<button id="close-cart" type="button" aria-label="Close cart" onclick="closeCart()">×</button>
</div>
<div id="cart-items">Your cart is empty.</div>
<div id="total">Total: $0.00</div>
<button class="button" id="checkout" type="button" onclick="checkout()" disabled>Continue to Checkout</button>
<p id="message"></p>
</section>
</div>

<footer>
<p>Show your personality every day, everywhere. 📱</p>
</footer>

<script>
"use strict";

const WORKER_URL = "https://case-district-checkout.casedistrictcases.workers.dev";

const products = [
{id:"clear_magsafe",name:"Clear MagSafe",price:9.99,style:"clear",description:"A clear, simple phone case that protects your phone."},
{id:"matte_color",name:"Matte Color",price:10.99,style:"colored",description:"A smooth MagSafe case that protects with style."},
{id:"colored_edge",name:"Colored Edge",price:11.99,style:"colored",description:"A colorful design that shows your personality."},
{id:"carbon_fiber",name:"Carbon Fiber",price:13.99,style:"carbon",description:"A carbon fiber style case."}
];

function safeGet(key, fallback) {
try {
const value = localStorage.getItem(key);
return value === null ? fallback : value;
} catch(error) {
return fallback;
}
}

function safeSet(key, value) {
try {
localStorage.setItem(key, value);
} catch(error) {
console.warn("Could not save data:", error);
}
}

function loadCart() {
try {
const saved = JSON.parse(safeGet("caseDistrictCart", "[]"));
if (!Array.isArray(saved)) return [];

return saved.filter(item =>
item &&
typeof item.id === "string" &&
typeof item.name === "string" &&
typeof item.model === "string" &&
Number.isFinite(item.price) &&
Number.isInteger(item.quantity) &&
item.quantity > 0 &&
products.some(p => p.id === item.id)
);
} catch(error) {
return [];
}
}

let cart = loadCart();

const validModels = [
"iPhone 16","iPhone 16 Pro","iPhone 16 Pro Max",
"iPhone 17","iPhone 17 Pro","iPhone 17 Pro Max",
"iPhone 18","iPhone 18 Pro","iPhone 18 Pro Max"
];

let selectedModel = safeGet("caseDistrictModel", "");
if (!validModels.includes(selectedModel)) selectedModel = "";

const modelSelect = document.getElementById("iphone-model");
const modelMessage = document.getElementById("model-message");
const productsContainer = document.getElementById("products");
const cartItems = document.getElementById("cart-items");
const cartCount = document.getElementById("cart-count");
const totalDisplay = document.getElementById("total");
const checkoutButton = document.getElementById("checkout");
const message = document.getElementById("message");
const overlay = document.getElementById("cart-overlay");

function selectModel() {
selectedModel = modelSelect.value;
safeSet("caseDistrictModel", selectedModel);

modelMessage.textContent = selectedModel
? "Selected: " + selectedModel
: "Please select your iPhone model before shopping.";

displayProducts();
}

modelSelect.value = selectedModel;
modelSelect.addEventListener("change", selectModel);

function openCart() {
overlay.classList.add("open");
document.body.style.overflow = "hidden";
}

function closeCart() {
overlay.classList.remove("open");
document.body.style.overflow = "";
}

overlay.addEventListener("click", function(event) {
if (event.target === overlay) closeCart();
});

document.addEventListener("keydown", function(event) {
if (event.key === "Escape") closeCart();
});

function saveCart() {
safeSet("caseDistrictCart", JSON.stringify(cart));
}

function displayProducts() {
productsContainer.innerHTML = products.map(p => `
<div class="product">
<a class="case-art ${p.id === "clear_magsafe" ? "clear-art" : ""}" href="product.html?id=${encodeURIComponent(p.id)}">
${p.id === "clear_magsafe"
? '<img class="case-photo" src="clear-magsafe.png" alt="Clear MagSafe phone case">'
: `<div class="phone-case ${p.style}"></div>`}
</a>
<h3><a href="product.html?id=${encodeURIComponent(p.id)}">${p.name}</a></h3>
<p>${p.description}</p>
<p class="price">$${p.price.toFixed(2)}</p>
<button class="button" type="button"
${selectedModel ? "" : "disabled"}
onclick="addToCart('${p.id}')">
${selectedModel ? "Add to Cart" : "Choose Model First"}
</button>
</div>
`).join("");
}

function addToCart(id) {
if (!selectedModel) {
alert("Please select your iPhone model first.");
return;
}

const product = products.find(p => p.id === id);
if (!product) return;

const existing = cart.find(x =>
x.id === id && x.model === selectedModel
);

if (existing) {
existing.quantity++;
} else {
cart.push({
id: product.id,
name: product.name,
price: product.price,
model: selectedModel,
quantity: 1
});
}

saveCart();
renderCart();
}

function changeQuantity(id, model, amount) {
const item = cart.find(x => x.id === id && x.model === model);
if (!item) return;

item.quantity += amount;

if (item.quantity <= 0) {
cart = cart.filter(x => !(x.id === id && x.model === model));
}

saveCart();
renderCart();
}

function renderCart() {
const count = cart.reduce((sum, item) => sum + item.quantity, 0);
const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

cartCount.textContent = count;
totalDisplay.textContent = "Total: $" + total.toFixed(2);
checkoutButton.disabled = cart.length === 0;

cartItems.innerHTML = cart.length ? cart.map(x => `
<div class="cart-item">
<span>
${x.name}<br>
${x.model}<br>
$${x.price.toFixed(2)}
</span>
<span>
<button type="button" onclick="changeQuantity('${x.id}','${x.model}',-1)">−</button>
${x.quantity}
<button type="button" onclick="changeQuantity('${x.id}','${x.model}',1)">+</button>
</span>
</div>
`).join("") : "Your cart is empty.";
}

async function checkout() {
if (!cart.length) return;

const originalText = "Continue to Checkout";

checkoutButton.disabled = true;
checkoutButton.textContent = "Connecting to checkout...";
message.textContent = "";

try {
const response = await fetch(WORKER_URL, {
method: "POST",
headers: {"Content-Type": "application/json"},
body: JSON.stringify({
items: cart.map(x => ({
id: x.id,
quantity: x.quantity,
model: x.model
}))
})
});

const data = await response.json();

if (!response.ok || !data.url) {
throw new Error(data.error || "Checkout could not be started.");
}

if (!data.url.startsWith("https://")) {
throw new Error("Invalid checkout address.");
}

window.location.assign(data.url);

} catch(error) {
message.textContent = error.message || "Something went wrong. Please try again.";
checkoutButton.disabled = false;
checkoutButton.textContent = originalText;
}
}

try {
displayProducts();
renderCart();

modelMessage.textContent = selectedModel
? "Selected: " + selectedModel
: "Please select your iPhone model before shopping.";

} catch(error) {
console.error("Website startup error:", error);
productsContainer.textContent = "Sorry, something went wrong loading products. Please refresh the page.";
}
</script>

</body>
</html>
