
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case District | iPhone Cases</title>
  <meta name="description" content="Shop stylish iPhone cases at Case District.">
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #171717;
    }
    header {
      background: #111;
      color: white;
      padding: 24px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 2px;
    }
    header button {
      background: white;
      color: #111;
      border: 0;
      padding: 12px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .hero {
      text-align: center;
      padding: 65px 20px;
      background: #e9e9e9;
    }
    .hero h1 {
      font-size: clamp(34px, 6vw, 55px);
      margin: 0 0 12px;
    }
    .hero p { color: #555; }
    main { padding: 35px 7%; }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
    }
    .product {
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 3px 14px #0000000d;
    }
    .case-art {
      height: 210px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eee;
    }
    .phone-case {
      width: 105px;
      height: 175px;
      border: 5px solid #222;
      border-radius: 23px;
      position: relative;
      box-shadow: 0 7px 15px #0002;
    }
    .phone-case::before {
      content: "";
      position: absolute;
      top: 12px;
      left: 12px;
      width: 35px;
      height: 35px;
      border: 4px solid #555;
      border-radius: 12px;
    }
    .clear { background: #dce7e5; }
    .navy { background: #172d4b; }
    .colored { background: linear-gradient(135deg,#f5a1a1,#e9c1f5); }
    .carbon {
      background: repeating-linear-gradient(45deg,#202020,#202020 5px,#383838 5px,#383838 10px);
    }
    .product h3 { margin-bottom: 7px; }
    .price { font-weight: bold; font-size: 19px; }
    .button {
      width: 100%;
      border: 0;
      border-radius: 6px;
      padding: 13px;
      background: #111;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .button:hover { background: #333; }
    #cart {
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-top: 35px;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }
    .cart-item button {
      padding: 5px 10px;
      cursor: pointer;
    }
    #total {
      font-size: 21px;
      font-weight: bold;
      margin-top: 20px;
    }
    #checkout {
      background: #167443;
    }
    #checkout:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
    #message {
      margin-top: 12px;
      color: #b00020;
    }
    footer {
      text-align: center;
      padding: 30px;
      background: #111;
      color: white;
      margin-top: 50px;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">CASE DISTRICT</div>
    <button onclick="document.getElementById('cart').scrollIntoView({behavior:'smooth'})">
      Cart (<span id="cart-count">0</span>)
    </button>
  </header>

  <section class="hero">
    <h1>Find Your Case.</h1>
    <p>Simple style. Everyday protection.</p>
  </section>

  <main>
    <h2>Shop Our Cases</h2>
    <div class="products" id="products"></div>

    <section id="cart">
      <h2>Your Shopping Cart</h2>
      <div id="cart-items">Your cart is empty.</div>
      <div id="total">Total: $0.00</div>
      <button class="button" id="checkout" onclick="checkout()" disabled>
        Continue to Checkout
      </button>
      <p id="message"></p>
    </section>
  </main>

  <footer>
    <p>© 2026 Case District. All rights reserved.</p>
  </footer>

  <script>
    const WORKER_URL =
      "https://case-district-checkout.casedistrictcases.workers.dev";

    const products = [
      {
        id: "classic_clear",
        name: "Classic Clear",
        price: 9.99,
        style: "clear"
      },
      {
        id: "matte_navy",
        name: "Matte Navy",
        price: 10.99,
        style: "navy"
      },
      {
        id: "colored_edge",
        name: "Colored Edge",
        price: 11.99,
        style: "colored"
      },
      {
        id: "carbon_fiber",
        name: "Carbon Fiber",
        price: 13.99,
        style: "carbon"
      }
    ];

    let cart = [];

    function displayProducts() {
      const container = document.getElementById("products");

      container.innerHTML = products.map(product => `
        <div class="product">
          <div class="case-art">
            <div class="phone-case ${product.style}"></div>
          </div>
          <h3>${product.name}</h3>
          <p class="price">$${product.price.toFixed(2)}</p>
          <button class="button" onclick="addToCart('${product.id}')">
            Add to Cart
          </button>
        </div>
      `).join("");
    }

    function addToCart(id) {
      const product = products.find(item => item.id === id);
      const existing = cart.find(item => item.id === id);

      if (existing) {
        existing.quantity++;
      } else {
        cart.push({ ...product, quantity: 1 });
      }

      renderCart();
    }

    function changeQuantity(id, amount) {
      const item = cart.find(product => product.id === id);
      if (!item) return;

      item.quantity += amount;

      if (item.quantity <= 0) {
        cart = cart.filter(product => product.id !== id);
      }

      renderCart();
    }

    function renderCart() {
      const container = document.getElementById("cart-items");
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);
      const total = cart.reduce(
        (sum, item) => sum + item.price * item.quantity, 0
      );

      document.getElementById("cart-count").textContent = count;
      document.getElementById("total").textContent =
        "Total: $" + total.toFixed(2);

      document.getElementById("checkout").disabled = cart.length === 0;

      if (cart.length === 0) {
        container.textContent = "Your cart is empty.";
        return;
      }

      container.innerHTML = cart.map(item => `
        <div class="cart-item">
          <span>${item.name} — $${item.price.toFixed(2)}</span>
          <span>
            <button onclick="changeQuantity('${item.id}', -1)">−</button>
            ${item.quantity}
            <button onclick="changeQuantity('${item.id}', 1)">+</button>
          </span>
        </div>
      `).join("");
    }

    async function checkout() {
      const button = document.getElementById("checkout");
      const message = document.getElementById("message");

      if (cart.length === 0) return;

      button.disabled = true;
      button.textContent = "Connecting to checkout...";
      message.textContent = "";

      try {
        const response = await fetch(
          WORKER_URL,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              items: cart.map(item => ({
                id: item.id,
                quantity: item.quantity
              }))
            })
          }
        );

        const data = await response.json();

        if (!response.ok || !data.url) {
          throw new Error(data.error || "Checkout could not be started.");
        }

        window.location.href = data.url;
      } catch (error) {
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = "Continue to Checkout";
      }
    }

    displayProducts();
    renderCart();
  </script>
</body>
</html>
