
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case District | iPhone Cases</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f7f7;color:#171717}
header{background:#111;color:white;padding:24px 7%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:800;letter-spacing:2px;color:white;text-decoration:none}
header button,.button{border:0;border-radius:6px;padding:13px;background:#111;color:white;font-weight:bold;cursor:pointer}
header button{background:white;color:#111}
.hero{text-align:center;padding:65px 20px;background:#e9e9e9}
.hero h1{font-size:clamp(34px,6vw,55px);margin:0 0 12px}
main{padding:35px 7%}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
.product{background:white;border-radius:12px;padding:18px;box-shadow:0 3px 14px #0000000d}
.case-art{height:210px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#eee;text-decoration:none}
.phone-case{width:105px;height:175px;border:5px solid #222;border-radius:23px;position:relative;box-shadow:0 7px 15px #0002}
.phone-case:before{content:"";position:absolute;top:12px;left:12px;width:35px;height:35px;border:4px solid #555;border-radius:12px}
.clear{background:#dce7e5}.navy{background:#172d4b}
.colored{background:linear-gradient(135deg,#f5a1a1,#e9c1f5)}
.carbon{background:repeating-linear-gradient(45deg,#202020,#202020 5px,#383838 5px,#383838 10px)}
.product h3 a{color:#171717;text-decoration:none}
.product h3 a:hover{text-decoration:underline}
.price{font-weight:bold;font-size:19px}
.button{width:100%;margin-top:10px}
#cart{background:white;padding:22px;border-radius:12px;margin-top:35px}
.cart-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #ddd}
.cart-item button{padding:5px 10px;cursor:pointer}
#total{font-size:21px;font-weight:bold;margin-top:20px}
#checkout{background:#167443}
#checkout:disabled{opacity:.5;cursor:not-allowed}
#message{margin-top:12px;color:#b00020}
footer{text-align:center;padding:30px;background:#111;color:white;margin-top:50px}
</style>
</head>
<body>
<header>
<a class="logo" href="index.html">CASE DISTRICT</a>
<button onclick="document.getElementById('cart').scrollIntoView({behavior:'smooth'})">
Cart (<span id="cart-count">0</span>)
</button>
</header>

<section class="hero">
<h1>Find Your Case.</h1>
<p>Simple style. Everyday protection.</p>
</section>

<main>
<h2>Shop Our Cases</h2>
<div class="products" id="products"></div>

<section id="cart">
<h2>Your Shopping Cart</h2>
<div id="cart-items">Your cart is empty.</div>
<div id="total">Total: $0.00</div>
<button class="button" id="checkout" onclick="checkout()" disabled>Continue to Checkout</button>
<p id="message"></p>
</section>
</main>

<footer><p>© 2026 Case District. All rights reserved.</p></footer>

<script>
const WORKER_URL="https://case-district-checkout.casedistrictcases.workers.dev";

const products=[
{id:"clear_magsafe",name:"Clear MagSafe",price:9.99,style:"clear",description:"A clean, simple clear case that lets your phone's original design show through."},
{id:"matte_color",name:"Matte Color",price:10.99,style:"navy",description:"A sleek navy case with a smooth, understated matte look."},
{id:"colored_edge",name:"Colored Edge",price:11.99,style:"colored",description:"A colorful case design that adds a little personality to your everyday style."},
{id:"carbon_fiber",name:"Carbon Fiber",price:13.99,style:"carbon",description:"A dark carbon-fiber-inspired design for a bold, modern look."}
];

let cart=JSON.parse(localStorage.getItem("caseDistrictCart")||"[]");

function saveCart(){localStorage.setItem("caseDistrictCart",JSON.stringify(cart));}

function displayProducts(){
document.getElementById("products").innerHTML=products.map(p=>`
<div class="product">
<a class="case-art" href="product.html?id=${p.id}" aria-label="View ${p.name}">
<div class="phone-case ${p.style}"></div>
</a>
<h3><a href="product.html?id=${p.id}">${p.name}</a></h3>
<p class="price">$${p.price.toFixed(2)}</p>
<button class="button" onclick="addToCart('${p.id}')">Add to Cart</button>
</div>`).join("");
}

function addToCart(id){
const p=products.find(x=>x.id===id);
if(!p)return;
const existing=cart.find(x=>x.id===id);
if(existing)existing.quantity++;
else cart.push({id:p.id,name:p.name,price:p.price,quantity:1});
saveCart();renderCart();
}

function changeQuantity(id,amount){
const item=cart.find(x=>x.id===id);
if(!item)return;
item.quantity+=amount;
if(item.quantity<=0)cart=cart.filter(x=>x.id!==id);
saveCart();renderCart();
}

function renderCart(){
const count=cart.reduce((s,x)=>s+x.quantity,0);
const total=cart.reduce((s,x)=>s+x.price*x.quantity,0);
document.getElementById("cart-count").textContent=count;
document.getElementById("total").textContent="Total: $"+total.toFixed(2);
document.getElementById("checkout").disabled=cart.length===0;
document.getElementById("cart-items").innerHTML=cart.length?cart.map(x=>`
<div class="cart-item">
<span>${x.name} — $${x.price.toFixed(2)}</span>
<span><button onclick="changeQuantity('${x.id}',-1)">−</button>
${x.quantity}
<button onclick="changeQuantity('${x.id}',1)">+</button></span>
</div>`).join(""):"Your cart is empty.";
}

async function checkout(){
const button=document.getElementById("checkout");
const message=document.getElementById("message");
if(!cart.length)return;
button.disabled=true;button.textContent="Connecting to checkout...";message.textContent="";
try{
const response=await fetch(WORKER_URL,{
method:"POST",headers:{"Content-Type":"application/json"},
body:JSON.stringify({items:cart.map(x=>({id:x.id,quantity:x.quantity}))})
});
const data=await response.json();
if(!response.ok||!data.url)throw new Error(data.error||"Checkout could not be started.");
window.location.href=data.url;
}catch(error){
message.textContent=error.message;
button.disabled=false;button.textContent="Continue to Checkout";
}
}

displayProducts();renderCart();
</script>
</body>
</html>
